services:

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - app-network


  backend:
    image: abdessalem123/devops-appgestiondesprojets:latest
    container_name: backend
    restart: unless-stopped

    depends_on:
      - mysql

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/test_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

    ports:
      - "8080:8080"

    networks:
      - app-network


  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    networks:
      - app-network


  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped

    depends_on:
      - prometheus

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    networks:
      - app-network


volumes:
  mysql_data:
  grafana_data:


networks:
  app-network:
    driver: bridge
